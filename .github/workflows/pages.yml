name: Tobito 3D site build and Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tobito-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Validate and build static preview
        run: bash scripts/build.sh
      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          cp -R 3d _site/3d
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/js/tobito-3d-world.js
          test -s _site/3d/index.html
          test -s _site/3d/studio.css
          test -s _site/3d/studio.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
