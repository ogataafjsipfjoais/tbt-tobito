name: Validate Tobito and sync playable site for branch Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tobito-static-export
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Validate games and two-person journey
        run: |
          node --check assets/js/tobito-3d-world.js
          node --check assets/js/s320-model.js
          node --check 3d/studio.js
          node --check 3d/play.js
          node --check 3d/journey.js
          node --check 3d/chaos.js
          node --check 3d/tobito-character.js
          node --check 3d/flight-path.js
          node --check 3d/aircraft-mount.js
          node --check 3d/world.js
          node --check 3d/model-review.js
          node --check 3d/models/build-tobito-v4.cjs
          node --check 3d/gameport.js
          node --check 3d/arcade/arcade-runtime.js
          node --check 3d/goods.js
          node --check 3d/cursor.js
          node --check 3d/opening.js
          node --test tests/tobito-3d.test.cjs tests/tobito-3d-page.test.cjs tests/tobito-journey.test.cjs tests/tobito-cinematic.test.cjs tests/tobito-top.test.cjs tests/tobito-character.test.cjs tests/tobito-regressions.test.cjs tests/tobito-opening.test.cjs tests/tobito-glb.test.cjs tests/tobito-model-review.test.cjs tests/tobito-v4.test.cjs tests/tobito-passage.test.cjs tests/tobito-loading-hangar.test.cjs tests/tobito-stand.test.cjs
          php -l index.php
          php -l data.php
      - name: Generate the playable original site
        run: |
          php index.php > legacy.html
          test -s legacy.html
          test -s 3d/index.html
          test -s 3d/journey.css
          test -s 3d/journey.js
          test -s 3d/play.css
          test -s 3d/play.js
          test -s 3d/chaos.js
          test -s 3d/chaos.css
          test -s 3d/tobito-character.js
          test -s 3d/models/tobito-v3.glb
          test -s 3d/models/tobito-v4.glb
          test -s 3d/models/build-tobito-v4.cjs
          test -s 3d/model-review.html
          test -s 3d/model-review.css
          test -s 3d/model-review.js
          test -s 3d/flight-path.js
          test -s 3d/aircraft-mount.js
          test -s 3d/world.js
          test -s 3d/cinematic.css
          test -s 3d/gameport.js
          test -s 3d/gameport.css
          test -s 3d/arcade/index.html
          test -s 3d/arcade/arcade.css
          test -s 3d/arcade/arcade-runtime.js
          test -s 3d/goods.js
          test -s 3d/goods.css
          test -s 3d/cursor.js
          test -s 3d/cursor.css
          test -s 3d/polish.css
          test -s 3d/opening.css
          test -s 3d/opening.js
          test -s assets/models/body.glb
      - name: Commit the generated preview for GitHub Pages branch publishing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- legacy.html
          if git diff --cached --quiet; then
            echo 'Static preview is already up to date.'
          else
            git commit -m 'build: refresh playable Tobito legacy page [skip ci]'
            git push origin HEAD:main
          fi
