<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <radialGradient id="sciGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="combRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="120" r="90" fill="url(#sciGlow)"/>

  <!-- 足 -->
  <ellipse cx="80" cy="225" rx="14" ry="7" fill="#f59e0b"/>
  <ellipse cx="120" cy="225" rx="14" ry="7" fill="#f59e0b"/>
  <line x1="80" y1="210" x2="80" y2="225" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <line x1="120" y1="210" x2="120" y2="225" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>

  <!-- 翼 (白衣の袖) -->
  <path d="M 55 130 C 20 115 10 145 25 175 C 40 200 65 170 70 150 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <!-- 右翼はフラスコを持つ -->
  <path d="M 145 130 C 180 115 190 145 175 175 C 160 200 135 170 130 150 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>

  <!-- フラスコ (流体実験用) -->
  <g transform="translate(150, 160) scale(0.65)">
    <path d="M 15 5 L 25 5 L 25 18 L 38 42 C 40 46 36 50 30 50 L 10 50 C 4 50 0 46 2 42 L 15 18 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <path d="M 6 36 Q 20 32 34 36 L 30 50 L 10 50 Z" fill="#10b981" opacity="0.85"/>
  </g>

  <!-- からだ (白衣を着たとび斗くん) -->
  <ellipse cx="100" cy="150" rx="58" ry="60" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <!-- 白衣の前立て & ボタン -->
  <line x1="100" y1="135" x2="100" y2="210" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="100" cy="155" r="2.5" fill="#64748b"/>
  <circle cx="100" cy="175" r="2.5" fill="#64748b"/>
  <circle cx="100" cy="195" r="2.5" fill="#64748b"/>
  <!-- ポケット -->
  <rect x="72" y="165" width="16" height="18" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="77" y1="160" x2="77" y2="168" stroke="#ef4444" stroke-width="1.5"/>

  <!-- 赤いトサカ -->
  <path d="M 75 75 C 75 45 92 42 95 68 C 100 35 120 35 118 68 C 126 48 140 50 132 75 Z" fill="url(#combRed)"/>

  <!-- 理系フレームメガネ -->
  <circle cx="78" cy="116" r="13" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="122" cy="116" r="13" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="91" y1="116" x2="109" y2="116" stroke="#1e293b" stroke-width="2.5"/>

  <!-- つぶらな目 -->
  <circle cx="78" cy="116" r="5" fill="#0f172a"/>
  <circle cx="76" cy="113" r="2" fill="#ffffff"/>
  <circle cx="122" cy="116" r="5" fill="#0f172a"/>
  <circle cx="120" cy="113" r="2" fill="#ffffff"/>

  <!-- ほっぺのチーク -->
  <circle cx="60" cy="126" r="6" fill="#f43f5e" opacity="0.3"/>
  <circle cx="140" cy="126" r="6" fill="#f43f5e" opacity="0.3"/>

  <!-- クチバシ -->
  <polygon points="100,118 86,136 114,136" fill="#f59e0b"/>
  <polygon points="100,144 91,136 109,136" fill="#d97706"/>

  <!-- あごの肉垂 -->
  <circle cx="100" cy="148" r="5.5" fill="#ef4444"/>
</svg>
