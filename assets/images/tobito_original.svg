<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <radialGradient id="tobitoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="combRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="beakYel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goggleGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- 背景オーラ -->
  <circle cx="100" cy="120" r="90" fill="url(#tobitoGlow)"/>

  <!-- 足 (オレンジ) -->
  <ellipse cx="80" cy="225" rx="14" ry="7" fill="#f59e0b"/>
  <ellipse cx="120" cy="225" rx="14" ry="7" fill="#f59e0b"/>
  <line x1="80" y1="210" x2="80" y2="225" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <line x1="120" y1="210" x2="120" y2="225" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>

  <!-- 翼 (左パタパタ) -->
  <path d="M 55 130 C 20 115 10 145 25 175 C 40 200 65 170 70 150 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- 翼 (右パタパタ) -->
  <path d="M 145 130 C 180 115 190 145 175 175 C 160 200 135 170 130 150 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- からだ (もふもふ白ニワトリ) -->
  <ellipse cx="100" cy="150" rx="58" ry="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <!-- おなかのやわらかアクセント -->
  <path d="M 70 145 Q 100 185 130 145 Q 100 175 70 145 Z" fill="#f0f9ff"/>

  <!-- 赤いトサカ (頭頂部) -->
  <path d="M 75 75 C 75 45 92 42 95 68 C 100 35 120 35 118 68 C 126 48 140 50 132 75 Z" fill="url(#combRed)"/>

  <!-- 飛行士ゴーグル (頭につけている) -->
  <path d="M 52 88 Q 100 78 148 88" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- 左レンズ -->
  <circle cx="80" cy="85" r="14" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="80" cy="85" r="11" fill="url(#goggleGlass)"/>
  <ellipse cx="76" cy="81" rx="4" ry="2.5" fill="#ffffff" opacity="0.8"/>
  <!-- 右レンズ -->
  <circle cx="120" cy="85" r="14" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="120" cy="85" r="11" fill="url(#goggleGlass)"/>
  <ellipse cx="116" cy="81" rx="4" ry="2.5" fill="#ffffff" opacity="0.8"/>
  <rect x="91" y="83" width="18" height="4" rx="1" fill="#1e293b"/>

  <!-- つぶらな目 -->
  <circle cx="78" cy="116" r="6.5" fill="#0f172a"/>
  <circle cx="76" cy="113" r="2.5" fill="#ffffff"/>
  <circle cx="122" cy="116" r="6.5" fill="#0f172a"/>
  <circle cx="120" cy="113" r="2.5" fill="#ffffff"/>

  <!-- ほっぺのチーク (ピンク) -->
  <circle cx="62" cy="126" r="7" fill="#f43f5e" opacity="0.3"/>
  <circle cx="138" cy="126" r="7" fill="#f43f5e" opacity="0.3"/>

  <!-- クチバシ (三角) -->
  <polygon points="100,118 86,136 114,136" fill="url(#beakYel)"/>
  <polygon points="100,144 91,136 109,136" fill="#d97706"/>

  <!-- あごの肉垂 (赤いぷっくり) -->
  <circle cx="100" cy="148" r="5.5" fill="#ef4444"/>
</svg>
