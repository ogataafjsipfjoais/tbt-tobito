<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- 青空と雲のグラデーション -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- トサカ用赤グラデーション -->
    <linearGradient id="combGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <!-- クチバシ用オレンジ -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- ゴーグルのレンズ -->
    <linearGradient id="goggleGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <!-- ソフトシャドウ -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 背景サークル（琵琶湖の青空と太陽光） -->
  <circle cx="300" cy="300" r="270" fill="url(#skyGrad)"/>
  <circle cx="300" cy="300" r="260" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 8" opacity="0.5"/>

  <!-- 雲の装飾 -->
  <path d="M 80,380 Q 110,350 150,370 Q 190,340 220,380 Q 240,410 200,420 L 90,420 Z" fill="#ffffff" opacity="0.6"/>
  <path d="M 400,220 Q 430,190 470,210 Q 510,180 530,220 Q 550,250 510,260 L 410,260 Z" fill="#ffffff" opacity="0.6"/>

  <!-- プロペラ風の飛行軌跡 -->
  <path d="M 120,200 Q 200,160 300,180" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.7"/>

  <!-- キャラクター本体（とびと君） -->
  <g filter="url(#softShadow)">
    <!-- あし（オレンジ） -->
    <!-- 左足 -->
    <ellipse cx="240" cy="485" rx="32" ry="16" fill="#f59e0b"/>
    <path d="M 240,440 L 240,480" stroke="#d97706" stroke-width="12" stroke-linecap="round"/>
    <!-- 右足 -->
    <ellipse cx="360" cy="485" rx="32" ry="16" fill="#f59e0b"/>
    <path d="M 360,440 L 360,480" stroke="#d97706" stroke-width="12" stroke-linecap="round"/>

    <!-- からだ（もふもふの白いニワトリボディ） -->
    <ellipse cx="300" cy="350" rx="145" ry="135" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>

    <!-- おなかの羽模様（やわらかな水色アクセント） -->
    <path d="M 230,340 Q 300,430 370,340 Q 300,410 230,340 Z" fill="#f0f9ff" opacity="0.7"/>

    <!-- 左の翼（パタパタ元気に広げている） -->
    <path d="M 170,330 C 110,300 70,330 90,390 C 120,440 180,390 190,360 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <!-- 右の翼（飛び立つポーズ） -->
    <path d="M 430,330 C 490,300 530,330 510,390 C 480,440 420,390 410,360 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>

    <!-- トサカ（立派な赤いトサカ・3連コーム） -->
    <path d="M 240,195 C 240,140 280,135 285,185 C 295,120 345,120 340,185 C 355,145 385,150 370,195 Z" fill="url(#combGrad)"/>

    <!-- 飛行士ゴーグル（パイロット風装備） -->
    <!-- ゴーグルバンド -->
    <path d="M 180,225 Q 300,205 420,225" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
    <!-- 左レンズフレーム -->
    <circle cx="250" cy="220" r="32" fill="#334155" stroke="#f8fafc" stroke-width="4"/>
    <circle cx="250" cy="220" r="26" fill="url(#goggleGlass)"/>
    <ellipse cx="242" cy="212" rx="10" ry="6" fill="#ffffff" opacity="0.7"/>
    <!-- 右レンズフレーム -->
    <circle cx="350" cy="220" r="32" fill="#334155" stroke="#f8fafc" stroke-width="4"/>
    <circle cx="350" cy="220" r="26" fill="url(#goggleGlass)"/>
    <ellipse cx="342" cy="212" rx="10" ry="6" fill="#ffffff" opacity="0.7"/>
    <!-- 連結ブリッジ -->
    <rect x="276" y="215" width="48" height="10" rx="3" fill="#334155"/>

    <!-- つぶらな目（くりくりの大きな瞳） -->
    <!-- 左目 -->
    <circle cx="245" cy="285" r="14" fill="#0f172a"/>
    <circle cx="240" cy="280" r="5" fill="#ffffff"/>
    <circle cx="248" cy="290" r="2" fill="#ffffff"/>
    <!-- 右目 -->
    <circle cx="355" cy="285" r="14" fill="#0f172a"/>
    <circle cx="350" cy="280" r="5" fill="#ffffff"/>
    <circle cx="358" cy="290" r="2" fill="#ffffff"/>

    <!-- ほっぺのチーク（ピンクでかわいい） -->
    <circle cx="205" cy="305" r="16" fill="#f43f5e" opacity="0.25"/>
    <circle cx="395" cy="305" r="16" fill="#f43f5e" opacity="0.25"/>

    <!-- クチバシ（元気な黄色・三角） -->
    <polygon points="300,285 270,325 330,325" fill="url(#beakGrad)"/>
    <polygon points="300,340 280,325 320,325" fill="#d97706"/>

    <!-- あごの肉垂（あかいぷっくり） -->
    <circle cx="300" cy="348" r="12" fill="#ef4444"/>

    <!-- TBT公式ロゴメダル・ペンダント（首元） -->
    <g transform="translate(275, 375)">
      <circle cx="25" cy="25" r="24" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
      <text x="25" y="32" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">
        TBT
      </text>
    </g>
  </g>

  <!-- 名前タグバナー -->
  <g transform="translate(150, 520)">
    <rect width="300" height="52" rx="26" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
    <text x="150" y="34" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="2">
      とびと君
    </text>
    <text x="150" y="47" text-anchor="middle" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#bae6fd" letter-spacing="2">
      TBT OFFICIAL MASCOT
    </text>
  </g>
</svg>
